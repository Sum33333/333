services:
  monitor:
    build: ..
    ports:
      - "8080:8080"
    env_file:
      - campus.env
    environment:
      PYTHONPATH: /app
    restart: unless-stopped
    volumes:
      - monitor-data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - monitor
    restart: unless-stopped

volumes:
  monitor-data:
